name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        env:
          COMPOSER_NO_AUDIT: 1
        run: |
          composer require "illuminate/contracts:12.*" "illuminate/support:12.*" "illuminate/database:12.*" "illuminate/queue:12.*" "illuminate/broadcasting:12.*" "illuminate/http:12.*" "illuminate/validation:12.*" --no-update
          composer require "orchestra/testbench:^10.0" --dev --no-update
          composer update --prefer-dist --no-interaction -W

      - name: Run release readiness gate
        run: vendor/bin/phpunit --filter ReleaseReadinessTest

      - name: List recent commits for release analysis
        run: git log --no-merges -10 --pretty=format:'- %s'

      - name: Create GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/create-release.sh
          .github/scripts/create-release.sh

      - name: Sync composer.json and README metadata
        if: steps.release.outputs.published == 'true'
        shell: bash
        run: |
          chmod +x .github/scripts/sync-release-metadata.sh
          .github/scripts/sync-release-metadata.sh "${{ steps.release.outputs.version }}"

      - name: Open PR to sync release files
        if: steps.release.outputs.published == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): sync version files [skip ci]"
          title: "chore(release): sync version files"
          body: |
            Automated sync of version metadata after release `${{ steps.release.outputs.tag }}`.

            Merges updated `CHANGELOG.md`, `composer.json`, and `README.md` into `main`.
          branch: chore/release-sync-${{ github.run_id }}
          base: main
          delete-branch: true
          add-paths: |
            CHANGELOG.md
            composer.json
            README.md
