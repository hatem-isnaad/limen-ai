name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  test:
    name: Release gate (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        env:
          COMPOSER_NO_AUDIT: 1
        run: |
          composer require "illuminate/contracts:12.*" "illuminate/support:12.*" "illuminate/database:12.*" "illuminate/queue:12.*" "illuminate/broadcasting:12.*" "illuminate/http:12.*" "illuminate/validation:12.*" --no-update
          composer require "orchestra/testbench:^10.0" --dev --no-update
          composer update --prefer-dist --no-interaction -W

      - name: Run full release test suite
        run: composer test:release

  release:
    name: Semantic release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install semantic-release
        run: npm install --no-audit --no-fund

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx semantic-release 2>&1 | tee semantic-release.log

      - name: Print semantic-release log on failure
        if: failure()
        run: cat semantic-release.log || true

      - name: Detect release file changes
        if: success()
        id: release_files
        run: |
          if git diff --quiet -- CHANGELOG.md composer.json README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR to sync release files
        if: success() && steps.release_files.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): sync version files [skip ci]"
          title: "chore(release): sync version files"
          body: |
            Automated sync of version metadata after semantic-release.

            Merges updated `CHANGELOG.md`, `composer.json`, and `README.md` into `main`.
          branch: chore/release-sync-${{ github.run_id }}
          base: main
          delete-branch: true
          add-paths: |
            CHANGELOG.md
            composer.json
            README.md
