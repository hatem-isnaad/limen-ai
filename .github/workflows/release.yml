# Release validation runs on push to `stg` via the Tests workflow (release-gate job).
# Tag and publish only after merging stg → main. Use workflow_dispatch below for
# optional manual re-validation before tagging on main.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate against composer.json (without v prefix)
        required: true
        type: string

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Verify composer version matches input
        run: |
          COMPOSER_VERSION=$(composer config version)
          if [ "${{ inputs.version }}" != "$COMPOSER_VERSION" ]; then
            echo "Input version ${{ inputs.version }} does not match composer.json version ${COMPOSER_VERSION}"
            exit 1
          fi

      - name: Run full release test suite
        run: composer test:release
