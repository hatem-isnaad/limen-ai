name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  test:
    name: Release gate (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        env:
          COMPOSER_NO_AUDIT: 1
        run: |
          composer require "illuminate/contracts:12.*" "illuminate/support:12.*" "illuminate/database:12.*" "illuminate/queue:12.*" "illuminate/broadcasting:12.*" "illuminate/http:12.*" "illuminate/validation:12.*" --no-update
          composer require "orchestra/testbench:^10.0" --dev --no-update
          composer update --prefer-dist --no-interaction -W

      - name: Run full release test suite
        run: composer test:release

  release:
    name: Semantic release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record latest release tag
        id: before
        run: |
          git fetch --tags --force
          if git describe --tags --match 'v*' --abbrev=0 >/dev/null 2>&1; then
            echo "tag=$(git describe --tags --match 'v*' --abbrev=0)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install semantic-release
        run: npm install --no-audit --no-fund

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx semantic-release 2>&1 | tee semantic-release.log

      - name: Print semantic-release log on failure
        if: failure()
        run: cat semantic-release.log || true

      - name: Detect published release
        if: success()
        id: published
        run: |
          git fetch --tags --force
          if git describe --tags --match 'v*' --abbrev=0 >/dev/null 2>&1; then
            AFTER="$(git describe --tags --match 'v*' --abbrev=0)"
          else
            AFTER=""
          fi

          BEFORE="${{ steps.before.outputs.tag }}"
          if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then
            VERSION="${AFTER#v}"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=$AFTER" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync composer.json and README metadata
        if: success() && steps.published.outputs.published == 'true'
        run: |
          chmod +x .github/scripts/sync-release-metadata.sh
          .github/scripts/sync-release-metadata.sh "${{ steps.published.outputs.version }}"

      - name: Open PR to sync release files
        if: success() && steps.published.outputs.published == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): sync version files [skip ci]"
          title: "chore(release): sync version files"
          body: |
            Automated sync of version metadata after semantic-release published `${{ steps.published.outputs.tag }}`.

            Merges updated `CHANGELOG.md`, `composer.json`, and `README.md` into `main`.
          branch: chore/release-sync-${{ github.run_id }}
          base: main
          delete-branch: true
          add-paths: |
            CHANGELOG.md
            composer.json
            README.md
