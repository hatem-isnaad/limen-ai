name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Verify composer version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          COMPOSER_VERSION=$(composer config version)
          if [ "$TAG" != "$COMPOSER_VERSION" ]; then
            echo "Tag v${TAG} does not match composer.json version ${COMPOSER_VERSION}"
            exit 1
          fi

      - name: Run full release test suite
        run: composer test:release
