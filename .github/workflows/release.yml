name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    name: Release gate (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        env:
          COMPOSER_NO_AUDIT: 1
        run: |
          composer require "illuminate/contracts:12.*" "illuminate/support:12.*" "illuminate/database:12.*" "illuminate/queue:12.*" "illuminate/broadcasting:12.*" "illuminate/http:12.*" "illuminate/validation:12.*" --no-update
          composer require "orchestra/testbench:^10.0" --dev --no-update
          composer update --prefer-dist --no-interaction -W

      - name: Run full release test suite
        run: composer test:release

  release:
    name: Semantic release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install semantic-release
        run: npm install --no-audit --no-fund

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
