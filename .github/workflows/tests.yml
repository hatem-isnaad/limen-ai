name: Tests

on:
  push:
    branches: [stg]
  pull_request:
    branches: [stg]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['11.*', '12.*']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        env:
          COMPOSER_NO_AUDIT: 1
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/queue:${{ matrix.laravel }}" "illuminate/broadcasting:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/validation:${{ matrix.laravel }}" --no-update
          if [ "${{ matrix.laravel }}" = "11.*" ]; then
            composer require "orchestra/testbench:^9.0" --dev --no-update
          else
            composer require "orchestra/testbench:^10.0" --dev --no-update
          fi
          composer update --prefer-dist --no-interaction -W

      - name: Run unit, integration, and feature tests
        run: vendor/bin/phpunit --testsuite Unit,Integration,Feature

      - name: Run architecture boundary gates
        run: vendor/bin/phpunit --testsuite Architecture

      - name: Run security critical gates
        run: vendor/bin/phpunit --testsuite Security

  release-gate:
    name: Release readiness gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        env:
          COMPOSER_NO_AUDIT: 1
        run: |
          composer require "illuminate/contracts:12.*" "illuminate/support:12.*" "illuminate/database:12.*" "illuminate/queue:12.*" "illuminate/broadcasting:12.*" "illuminate/http:12.*" "illuminate/validation:12.*" --no-update
          composer require "orchestra/testbench:^10.0" --dev --no-update
          composer update --prefer-dist --no-interaction -W

      - name: Run release gate
        run: composer test:release
