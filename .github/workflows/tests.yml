name: Tests

on:
  push:
    branches: [stg]
  pull_request:
    branches: [stg]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['11.*', '12.*']
        include:
          - php: '8.3'
            laravel: '12.*'
            coverage: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        env:
          COMPOSER_NO_AUDIT: 1
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/queue:${{ matrix.laravel }}" "illuminate/broadcasting:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/validation:${{ matrix.laravel }}" --no-update
          if [ "${{ matrix.laravel }}" = "11.*" ]; then
            composer require "orchestra/testbench:^9.0" --dev --no-update
          else
            composer require "orchestra/testbench:^10.0" --dev --no-update
          fi
          composer update --prefer-dist --no-interaction -W 2>&1 | tee composer-install.log

      - name: Run unit, integration, and feature tests
        run: vendor/bin/phpunit --testsuite Unit,Integration,Feature 2>&1 | tee phpunit-main.log

      - name: Run architecture boundary gates
        run: vendor/bin/phpunit --testsuite Architecture 2>&1 | tee phpunit-arch.log

      - name: Run security critical gates
        run: vendor/bin/phpunit --testsuite Security 2>&1 | tee phpunit-security.log

      - name: Upload coverage (PHP 8.3 / Laravel 12 only)
        if: matrix.coverage == true
        run: vendor/bin/phpunit --coverage-clover build/coverage.xml
        continue-on-error: true

      - name: Archive coverage artifact
        if: matrix.coverage == true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: build/coverage.xml
          if-no-files-found: ignore

      - name: Report CI failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = (file, lines = 120) => {
              if (!fs.existsSync(file)) return `[missing ${file}]`;
              return fs.readFileSync(file, 'utf8').split('\n').slice(-lines).join('\n');
            };
            const body = [
              `CI failed for **${{ matrix.php }} · Laravel ${{ matrix.laravel }}** on \`${{ github.event.pull_request.head.sha }}\`.`,
              '',
              '<details><summary>Install log</summary>',
              '',
              '```',
              tail('composer-install.log', 80),
              '```',
              '',
              '</details>',
              '',
              '<details><summary>PHPUnit main log</summary>',
              '',
              '```',
              tail('phpunit-main.log'),
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Architecture log</summary>',
              '',
              '```',
              tail('phpunit-arch.log'),
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Security log</summary>',
              '',
              '```',
              tail('phpunit-security.log'),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
