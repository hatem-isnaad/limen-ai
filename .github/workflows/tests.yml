name: Tests

on:
  push:
    branches: [stg]
  pull_request:
    branches: [stg]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['11.*', '12.*']
        include:
          - php: '8.3'
            laravel: '12.*'
            coverage: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        env:
          COMPOSER_NO_AUDIT: 1
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/queue:${{ matrix.laravel }}" "illuminate/broadcasting:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/validation:${{ matrix.laravel }}" --no-update
          if [ "${{ matrix.laravel }}" = "11.*" ]; then
            composer require "orchestra/testbench:^9.0" --dev --no-update
          else
            composer require "orchestra/testbench:^10.0" --dev --no-update
          fi
          composer update --prefer-dist --no-interaction -W

      - name: Run unit, integration, and feature tests
        run: |
          set -o pipefail
          vendor/bin/phpunit --testsuite Unit,Integration,Feature 2>&1 | tee phpunit-main.log

      - name: Report failure details on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (path) => { try { return fs.readFileSync(path, 'utf8'); } catch { return `[missing ${path}]`; } };
            const tail = (text, max = 4000) => text.length > max ? text.slice(-max) : text;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `CI failed for **PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}** on head \`${context.sha.slice(0, 7)}\`.\n\n\`\`\`\n${tail(read('phpunit-main.log'))}\n\`\`\``,
            });

      - name: Run architecture boundary gates
        run: vendor/bin/phpunit --testsuite Architecture

      - name: Run security critical gates
        run: vendor/bin/phpunit --testsuite Security

      - name: Upload coverage (PHP 8.3 / Laravel 12 only)
        if: matrix.coverage == true
        run: vendor/bin/phpunit --coverage-clover build/coverage.xml
        continue-on-error: true

      - name: Archive coverage artifact
        if: matrix.coverage == true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: build/coverage.xml
          if-no-files-found: ignore
